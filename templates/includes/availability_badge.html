{% if equipment.is_available %}
  <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-bold text-emerald-800"><span class="size-1.5 rounded-full bg-emerald-500"></span>Disponível</span>
{% elif equipment.lent_until %}
  <span class="inline-flex items-center rounded-full bg-stone-100 px-2.5 py-1 text-xs font-bold text-stone-700">Volta em {{ equipment.lent_until|date:"M/Y"|lower }}</span>
{% else %}
  <span class="inline-flex items-center rounded-full bg-stone-100 px-2.5 py-1 text-xs font-bold text-stone-700">Indisponível</span>
{% endif %}
