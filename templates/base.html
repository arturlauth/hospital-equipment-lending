{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Empréstimo de equipamentos{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <a href="{% url 'inventory:catalog' %}" class="text-lg font-semibold text-sky-700">Equipamentos</a>
      <div class="flex items-center gap-4 text-sm">
        {% if user.is_authenticated %}
          <a href="{% url 'lending:people' %}" class="text-slate-600 hover:text-sky-700">Pessoas</a>
          <form method="post" action="{% url 'staff:logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-slate-600 hover:text-sky-700">Sair</button>
          </form>
        {% else %}
          <a href="{% url 'staff:login' %}" class="rounded-lg bg-sky-700 px-3 py-1.5 font-medium text-white hover:bg-sky-800">Entrar</a>
        {% endif %}
      </div>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
