[project]
name = "hospital-equipment-lending"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytailwindcss>=0.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]

[tool.importlinter]
root_package = "hospitalequip"

[[tool.importlinter.contracts]]
name = "Only inventory imports inventory models"
type = "protected"
protected_modules = ["hospitalequip.inventory.models"]
allowed_importers = ["hospitalequip.inventory"]
ignore_imports = ["hospitalequip.lending.tests -> hospitalequip.inventory.models"]

[[tool.importlinter.contracts]]
name = "Only lending imports lending models"
type = "protected"
protected_modules = ["hospitalequip.lending.models"]
allowed_importers = ["hospitalequip.lending"]
ignore_imports = ["hospitalequip.inventory.tests -> hospitalequip.lending.models"]
