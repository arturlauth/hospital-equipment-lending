[project]
name = "hospital-equipment-lending"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]